<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun!</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif; /* Font ceria */
            background-color: #E0FFFF; /* Biru muda */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Sembunyikan overflow untuk animasi */
            position: relative;
        }

        .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.8); /* Latar belakang putih transparan */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #FF69B4; /* Warna pink untuk ucapan utama */
            font-size: 3.5em;
            margin-bottom: 10px;
            animation: bounce 2s infinite; /* Animasi memantul */
        }

        p {
            color: #333;
            font-size: 1.5em;
            margin-top: 0;
        }

        .cake-image {
            width: 250px;
            margin: 20px auto;
            display: block;
            animation: pulse 2s infinite alternate; /* Animasi berdenyut */
        }

        .balloon {
            position: absolute;
            width: 80px;
            height: 100px;
            background-color: #FFD700; /* Balon kuning */
            border-radius: 50%;
            bottom: -100px; /* Mulai dari bawah layar */
            animation: floatUp 10s infinite ease-in-out; /* Animasi melayang ke atas */
            opacity: 0.8;
            z-index: 5;
        }

        .balloon:nth-child(2) {
            background-color: #FF69B4; /* Balon pink */
            left: 10%;
            animation-delay: 2s;
            transform: scale(0.9);
        }

        .balloon:nth-child(3) {
            background-color: #98FB98; /* Balon hijau muda */
            right: 15%;
            animation-delay: 4s;
            transform: scale(1.1);
        }

        .balloon:nth-child(4) {
            background-color: #ADD8E6; /* Balon biru muda */
            left: 25%;
            animation-delay: 6s;
            transform: scale(0.8);
        }

        /* Keyframes untuk animasi */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-30px);
            }
            60% {
                transform: translateY(-15px);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.05);
            }
        }

        @keyframes floatUp {
            0% {
                bottom: -100px;
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                bottom: 100vh;
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="balloon" style="left: 5%;"></div>
    <div class="balloon" style="right: 5%;"></div>
    <div class="balloon" style="left: 40%;"></div>
    <div class="balloon" style="right: 30%;"></div>

    <div class="container">
        <h1>Selamat Ulang Tahun!</h1>
        <p>Semoga harimu dipenuhi kebahagiaan, tawa, dan semua yang terbaik!</p>
        <img src="mie.png" alt="Kue Ulang Tahun" class="cake-image">
        <p>🎉🎂🎁</p>
    </div>
</body>
</html>
